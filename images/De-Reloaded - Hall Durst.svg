<title id="title">La Maison de la Mort — plan du hall</title><desc id="desc">Gabarit De-Reloaded de six mètres sur douze. Quatre colonnes A à D, huit rangées du seuil au sud vers l’escalier au nord. Elisabeth descend en B6. Le banc des dépouilles est en A2.</desc>
