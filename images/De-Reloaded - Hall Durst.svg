<text x="465" y="174" font-family="Georgia,serif" font-size="23">Repères de la rencontre</text>
<circle cx="478" cy="212" r="12" fill="#8b3439"/><text x="478" y="217" text-anchor="middle" font-size="14" fill="#fff8ee">E</text><text x="504" y="218">B6 · Elisabeth après sa descente</text>
<text x="465" y="265" font-weight="bold">A7–B8 · Escalier ordinaire</text><text x="465" y="289">Accès aux étages et au grenier.</text><text x="465" y="312">La balustrade peut donner un abri partiel.</text>
<text x="465" y="359" font-weight="bold">A2 · Banc des dépouilles</text><text x="465" y="383">Les paquets déposés ne bloquent pas</text><text x="465" y="406">les cases et ne sont pas des cibles.</text>
<text x="465" y="453" font-weight="bold">A4 · Cheminée et portrait</text><text x="465" y="477">D4 · Horloge, contre le mur</text>
<text x="465" y="524" font-weight="bold">A3, D3, D6 · Portes intérieures</text><text x="465" y="548">Les pièces voisines restent hors du hall.</text>
<rect x="465" y="578" width="18" height="18" fill="#dde3d5" stroke="#8f9b82"/><text x="496" y="593">B1–C6 · Passage central dégagé</text>
<text x="465" y="641">Les positions gagnées par les joueurs</text><text x="465" y="664">avant l’initiative sont conservées.</text>
</g><text x="55" y="760" font-family="Arial,sans-serif" font-size="13" fill="#756451">Cartographie propre à De-Reloaded · LazyLuigi · Correspondances : zones 1–2 du livre original</text></svg>
